<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Check</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding: 16px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 400px; margin: 0 auto; }
    .card-header { padding: 20px; text-align: center; }
    .card-header.available { background: linear-gradient(135deg, #43a047, #66bb6a); color: white; }
    .card-header.unavailable { background: linear-gradient(135deg, #e53935, #ef5350); color: white; }
    .card-header h2 { font-size: 20px; margin-bottom: 4px; }
    .card-header .icon { font-size: 48px; margin-bottom: 8px; }
    .card-body { padding: 20px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #888; font-size: 14px; }
    .detail-value { font-weight: 600; color: #333; font-size: 14px; }
    .total { margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 8px; text-align: center; }
    .total-amount { font-size: 28px; font-weight: 700; color: #1a1a2e; }
    .total-label { font-size: 12px; color: #888; margin-top: 2px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Checking availability...</div></div>
  <script>
    var root = document.getElementById('root');
    function render(data) {
      if (!data) { root.innerHTML = '<div class="loading">No data.</div>'; return; }
      if (data.error) { root.innerHTML = '<div class="error">Warning: ' + data.error + '</div>'; return; }
      var u = data.unicorn;
      var avail = data.available;
      root.innerHTML =
        '<div class="card">' +
          '<div class="card-header ' + (avail ? 'available' : 'unavailable') + '">' +
            '<div class="icon">' + (avail ? 'Available' : 'Unavailable') + '</div>' +
            '<h2>' + (avail ? 'Available!' : 'Not Available') + '</h2>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="detail-row"><span class="detail-label">Unicorn</span><span class="detail-value">' + u.name + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">' + u.type + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">' + data.date + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Duration</span><span class="detail-value">' + data.duration_hours + ' hour' + (data.duration_hours > 1 ? 's' : '') + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Rate</span><span class="detail-value">$' + u.hourly_rate.toFixed(2) + '/hr</span></div>' +
            '<div class="total"><div class="total-amount">$' + data.total_cost.toFixed(2) + '</div><div class="total-label">Estimated Total</div></div>' +
          '</div>' +
        '</div>';
    }
    window.addEventListener('message', function(event) {
      var msg = event.data;
      if (!msg) return;
      if (typeof msg === 'object' && msg.jsonrpc === '2.0' && msg.params) {
        var sc = msg.params.structuredContent || null;
        if (sc) render(sc);
      }
    });
    window.addEventListener('openai:set_globals', function(event) {
      var detail = event.detail;
      if (detail && detail.globals && detail.globals.toolOutput) { render(detail.globals.toolOutput); }
    });
    var pollCount = 0;
    (function checkOpenAI() {
      if (window.openai && window.openai.toolOutput) { render(window.openai.toolOutput); }
      else if (pollCount++ < 50) { setTimeout(checkOpenAI, 200); }
    })();
  </script>
</body>
</html>
