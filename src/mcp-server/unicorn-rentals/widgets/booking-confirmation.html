<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding: 16px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto; }
    .card-header { padding: 24px; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .card-header .icon { font-size: 56px; margin-bottom: 8px; }
    .card-header h2 { font-size: 22px; }
    .card-header .booking-id { font-size: 13px; opacity: 0.85; margin-top: 6px; font-family: monospace; }
    .card-body { padding: 20px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #888; font-size: 14px; }
    .detail-value { font-weight: 600; color: #333; font-size: 14px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: #e8f5e9; color: #2e7d32; }
    .rate-info { margin-top: 16px; padding: 16px; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 8px; text-align: center; }
    .rate-amount { font-size: 28px; font-weight: 700; color: #1b5e20; }
    .rate-label { font-size: 12px; color: #558b2f; margin-top: 2px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Processing booking...</div></div>
  <script>
    var root = document.getElementById('root');
    function formatDate(isoStr) {
      if (!isoStr) return 'N/A';
      var d = new Date(isoStr);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }
    function render(data) {
      if (!data) { root.innerHTML = '<div class="loading">No data.</div>'; return; }
      if (data.error) { root.innerHTML = '<div class="loading">Warning: ' + data.error + '</div>'; return; }
      root.innerHTML =
        '<div class="card">' +
          '<div class="card-header">' +
            '<div class="icon">&#x2714;</div>' +
            '<h2>Booking Confirmed!</h2>' +
            '<div class="booking-id">' + data.booking_id + '</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="status-badge">' + data.status + '</span></span></div>' +
            '<div class="detail-row"><span class="detail-label">Unicorn</span><span class="detail-value">' + data.unicorn_name + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Booked At</span><span class="detail-value">' + formatDate(data.booked_at) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Hourly Rate</span><span class="detail-value">$' + Number(data.hourly_rate).toFixed(2) + '/hr</span></div>' +
            '<div class="rate-info"><div class="rate-amount">$' + Number(data.hourly_rate).toFixed(2) + '/hr</div><div class="rate-label">Charged until returned</div></div>' +
          '</div>' +
        '</div>';
    }
    window.addEventListener('message', function(event) {
      var msg = event.data;
      if (!msg) return;
      if (typeof msg === 'object' && msg.jsonrpc === '2.0' && msg.params) {
        var sc = msg.params.structuredContent || null;
        if (sc) render(sc);
      }
    });
    window.addEventListener('openai:set_globals', function(event) {
      var detail = event.detail;
      if (detail && detail.globals && detail.globals.toolOutput) { render(detail.globals.toolOutput); }
    });
    var pollCount = 0;
    (function checkOpenAI() {
      if (window.openai && window.openai.toolOutput) { render(window.openai.toolOutput); }
      else if (pollCount++ < 50) { setTimeout(checkOpenAI, 200); }
    })();
  </script>
</body>
</html>
