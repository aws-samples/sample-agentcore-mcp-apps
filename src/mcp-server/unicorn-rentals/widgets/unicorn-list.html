<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicorn List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .card-img { width: 100%; height: 180px; object-fit: cover; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img .placeholder { font-size: 64px; }
    .card-body { padding: 16px; }
    .card-title { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .badge-classic { background: #e8f4fd; color: #1976d2; }
    .badge-rainbow { background: linear-gradient(90deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb); color: #333; }
    .badge-winged { background: #f3e5f5; color: #7b1fa2; }
    .desc { font-size: 14px; color: #666; line-height: 1.4; margin-bottom: 12px; }
    .price { font-size: 20px; font-weight: 700; color: #2e7d32; }
    .price span { font-size: 13px; font-weight: 400; color: #999; }
    .status { font-size: 12px; margin-top: 8px; }
    .available { color: #2e7d32; }
    .unavailable { color: #c62828; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #1a1a2e; }
    .header p { color: #666; font-size: 14px; margin-top: 4px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading unicorns...</div></div>
  <script>
    var root = document.getElementById('root');
    function badgeClass(type) { return 'badge badge-' + type.toLowerCase(); }
    function render(data) {
      if (!data || !data.unicorns) { root.innerHTML = '<div class="loading">No data available.</div>'; return; }
      var unicorns = data.unicorns;
      root.innerHTML = '<div class="header"><h1>AnyCompany Unicorn Rentals</h1><p>' + data.total + ' unicorn' + (data.total !== 1 ? 's' : '') + ' available</p></div>' +
        '<div class="grid">' + unicorns.map(function(u) {
          return '<div class="card">' +
            '<div class="card-img">' + (u.image_url ? '<img src="' + u.image_url + '" alt="' + u.name + '">' : '<span class="placeholder">&#129412;</span>') + '</div>' +
            '<div class="card-body">' +
              '<div class="card-title">' + u.name + '</div>' +
              '<span class="' + badgeClass(u.type) + '">' + u.type + '</span>' +
              '<p class="desc">' + u.description + '</p>' +
              '<div class="price">$' + u.hourly_rate.toFixed(2) + ' <span>/hour</span></div>' +
              '<div class="status ' + (u.available ? 'available' : 'unavailable') + '">' + (u.available ? 'Available' : 'Currently Unavailable') + '</div>' +
            '</div></div>';
        }).join('') + '</div>';
    }
    window.addEventListener('message', function(event) {
      var msg = event.data;
      if (!msg) return;
      if (typeof msg === 'object' && msg.jsonrpc === '2.0' && msg.params) {
        var sc = msg.params.structuredContent || null;
        if (sc) render(sc);
      }
    });
    window.addEventListener('openai:set_globals', function(event) {
      var detail = event.detail;
      if (detail && detail.globals && detail.globals.toolOutput) { render(detail.globals.toolOutput); }
    });
    var pollCount = 0;
    (function checkOpenAI() {
      if (window.openai && window.openai.toolOutput) { render(window.openai.toolOutput); }
      else if (pollCount++ < 50) { setTimeout(checkOpenAI, 200); }
    })();
  </script>
</body>
</html>
