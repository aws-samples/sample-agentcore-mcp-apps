<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Check</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mcp-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: var(--mcp-color-background, #f8f9fa);
      color: var(--mcp-color-text, #1a1a2e);
      padding: 16px;
    }
    .card { background: var(--mcp-color-surface, white); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 400px; margin: 0 auto; }
    .card-header { padding: 20px; text-align: center; }
    .card-header.available { background: linear-gradient(135deg, #43a047, #66bb6a); color: white; }
    .card-header.unavailable { background: linear-gradient(135deg, #e53935, #ef5350); color: white; }
    .card-header h2 { font-size: 20px; margin-bottom: 4px; }
    .card-header .icon { font-size: 48px; margin-bottom: 8px; }
    .card-body { padding: 20px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--mcp-color-text-secondary, #888); font-size: 14px; }
    .detail-value { font-weight: 600; font-size: 14px; }
    .total { margin-top: 16px; padding: 16px; background: #f8f9fa; border-radius: 8px; text-align: center; }
    .total-amount { font-size: 28px; font-weight: 700; }
    .total-label { font-size: 12px; color: #888; margin-top: 2px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Checking availability...</div></div>
  <script type="module" src="./availability-app.ts"></script>
</body>
</html>
