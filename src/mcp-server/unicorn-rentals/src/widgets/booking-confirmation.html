<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mcp-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: var(--mcp-color-background, #f8f9fa);
      color: var(--mcp-color-text, #1a1a2e);
      padding: 16px;
    }
    .card { background: var(--mcp-color-surface, white); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 420px; margin: 0 auto; }
    .card-header { padding: 24px; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .card-header .icon { font-size: 56px; margin-bottom: 8px; }
    .card-header h2 { font-size: 22px; }
    .card-header .booking-id { font-size: 13px; opacity: 0.85; margin-top: 6px; font-family: monospace; }
    .card-body { padding: 20px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--mcp-color-text-secondary, #888); font-size: 14px; }
    .detail-value { font-weight: 600; font-size: 14px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: #e8f5e9; color: #2e7d32; }
    .rate-info { margin-top: 16px; padding: 16px; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 8px; text-align: center; }
    .rate-amount { font-size: 28px; font-weight: 700; color: #1b5e20; }
    .rate-label { font-size: 12px; color: #558b2f; margin-top: 2px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Processing booking...</div></div>
  <script type="module" src="./booking-confirmation-app.ts"></script>
</body>
</html>
