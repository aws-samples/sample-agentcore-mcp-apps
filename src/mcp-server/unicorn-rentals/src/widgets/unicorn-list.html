<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicorn List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mcp-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: var(--mcp-color-background, #f8f9fa);
      color: var(--mcp-color-text, #1a1a2e);
      padding: 16px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--mcp-color-surface, white); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .card-img { width: 100%; height: 180px; object-fit: cover; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img .placeholder { font-size: 64px; }
    .card-body { padding: 16px; }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .badge-classic { background: #e8f4fd; color: #1976d2; }
    .badge-rainbow { background: linear-gradient(90deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb); color: #333; }
    .badge-winged { background: #f3e5f5; color: #7b1fa2; }
    .desc { font-size: 14px; color: var(--mcp-color-text-secondary, #666); line-height: 1.4; margin-bottom: 12px; }
    .price { font-size: 20px; font-weight: 700; color: #2e7d32; }
    .price span { font-size: 13px; font-weight: 400; color: #999; }
    .status { font-size: 12px; margin-top: 8px; }
    .available { color: #2e7d32; }
    .unavailable { color: #c62828; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; }
    .header p { color: var(--mcp-color-text-secondary, #666); font-size: 14px; margin-top: 4px; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading unicorns...</div></div>
  <script type="module" src="./unicorn-list-app.ts"></script>
</body>
</html>
